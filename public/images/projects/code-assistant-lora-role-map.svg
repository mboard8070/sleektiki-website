<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Codex role orchestration map</title>
  <desc id="desc">Diagram showing how Codex is configured as primary author, specialist reviewers, and final synthesis.</desc>
  <rect width="1400" height="820" fill="#0c1014"/>
  <rect x="36" y="36" width="1328" height="748" rx="18" fill="#111820" stroke="#2a3843"/>
  <text x="72" y="92" fill="#e4edf3" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">How Codex Was Split Into Roles</text>
  <text x="72" y="126" fill="#8aa0ad" font-family="Inter, Arial, sans-serif" font-size="16">A primary patch author stays in charge while LoRA and Codex reviewers inspect narrow, bounded responsibilities.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9bd5ef"/>
    </marker>
  </defs>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="72" y="190" width="250" height="116" rx="10" fill="#0b1117" stroke="#6fa2ba"/>
    <text x="98" y="226" fill="#9bd5ef" font-size="16" font-weight="700">User Request</text>
    <text x="98" y="257" fill="#d8e1e8" font-size="14">Task, repo target,</text>
    <text x="98" y="280" fill="#d8e1e8" font-size="14">retrieved files, tests</text>

    <rect x="430" y="176" width="280" height="144" rx="10" fill="#0b1117" stroke="#9bd5ef"/>
    <text x="462" y="214" fill="#9bd5ef" font-size="18" font-weight="700">Primary Author</text>
    <text x="462" y="245" fill="#e4edf3" font-size="15">Codex or 31B Gemma</text>
    <text x="462" y="271" fill="#8aa0ad" font-size="14">writes candidate patch</text>
    <text x="462" y="294" fill="#8aa0ad" font-size="14">and owns integration</text>

    <rect x="816" y="150" width="230" height="88" rx="10" fill="#0b1117" stroke="#2a3843"/>
    <text x="844" y="184" fill="#e4edf3" font-size="15" font-weight="700">Automated Evidence</text>
    <text x="844" y="211" fill="#8aa0ad" font-size="13">format, typecheck, tests</text>

    <rect x="816" y="270" width="230" height="88" rx="10" fill="#0b1117" stroke="#2a3843"/>
    <text x="844" y="304" fill="#e4edf3" font-size="15" font-weight="700">Bounded Diff</text>
    <text x="844" y="331" fill="#8aa0ad" font-size="13">changed files + context</text>

    <line x1="322" y1="248" x2="422" y2="248" stroke="#9bd5ef" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="710" y1="248" x2="805" y2="194" stroke="#9bd5ef" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="710" y1="248" x2="805" y2="314" stroke="#9bd5ef" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="72" y="414" fill="#9bd5ef" font-size="18" font-weight="700">LoRA Specialist Reviewers</text>
    <text x="72" y="442" fill="#8aa0ad" font-size="14">Small adapters return structured JSON: verdict, findings, missing checks, suggested fix.</text>

    <g transform="translate(72 482)" font-size="14">
      <rect width="178" height="78" rx="8" fill="#151d25" stroke="#2a3843"/><text x="18" y="31" fill="#e4edf3" font-weight="700">Python</text><text x="18" y="55" fill="#8aa0ad">env, service, tests</text>
      <rect x="196" width="178" height="78" rx="8" fill="#151d25" stroke="#2a3843"/><text x="214" y="31" fill="#e4edf3" font-weight="700">React</text><text x="214" y="55" fill="#8aa0ad">components, hooks</text>
      <rect x="392" width="178" height="78" rx="8" fill="#151d25" stroke="#2a3843"/><text x="410" y="31" fill="#e4edf3" font-weight="700">TypeScript</text><text x="410" y="55" fill="#8aa0ad">types, API clients</text>
      <rect x="588" width="178" height="78" rx="8" fill="#151d25" stroke="#2a3843"/><text x="606" y="31" fill="#e4edf3" font-weight="700">Vue</text><text x="606" y="55" fill="#8aa0ad">state, composables</text>
      <rect x="784" width="178" height="78" rx="8" fill="#151d25" stroke="#2a3843"/><text x="802" y="31" fill="#e4edf3" font-weight="700">SQL</text><text x="802" y="55" fill="#8aa0ad">RLS, migrations</text>
      <rect x="980" width="178" height="78" rx="8" fill="#151d25" stroke="#2a3843"/><text x="998" y="31" fill="#e4edf3" font-weight="700">Docker/CI</text><text x="998" y="55" fill="#8aa0ad">secrets, deploy</text>
    </g>

    <g transform="translate(72 590)" font-size="14">
      <rect width="244" height="78" rx="8" fill="#151d25" stroke="#2a3843"/><text x="18" y="31" fill="#e4edf3" font-weight="700">Testing Reviewer</text><text x="18" y="55" fill="#8aa0ad">coverage and regression checks</text>
      <rect x="268" width="244" height="78" rx="8" fill="#151d25" stroke="#2a3843"/><text x="286" y="31" fill="#e4edf3" font-weight="700">Orchestration Reviewer</text><text x="286" y="55" fill="#8aa0ad">routing and verifier loop</text>
      <rect x="536" width="244" height="78" rx="8" fill="#151d25" stroke="#2a3843"/><text x="554" y="31" fill="#e4edf3" font-weight="700">Codex Cloud Reviewers</text><text x="554" y="55" fill="#8aa0ad">C++, Java, frontend, a11y</text>
      <rect x="804" width="244" height="78" rx="8" fill="#151d25" stroke="#6fa2ba"/><text x="822" y="31" fill="#9bd5ef" font-weight="700">Codex Synthesis</text><text x="822" y="55" fill="#8aa0ad">deduped final review</text>
    </g>

    <line x1="931" y1="358" x2="931" y2="468" stroke="#9bd5ef" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1118" y1="630" x2="1228" y2="630" stroke="#9bd5ef" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1238" y="582" width="90" height="96" rx="10" fill="#0b1117" stroke="#9bd5ef"/>
    <text x="1262" y="620" fill="#9bd5ef" font-size="15" font-weight="700">Revise</text>
    <text x="1261" y="647" fill="#8aa0ad" font-size="13">or</text>
    <text x="1260" y="672" fill="#9bd5ef" font-size="15" font-weight="700">Apply</text>
  </g>
</svg>
